# pyproject.toml: single source of truth for how this project is built,
# installed, and tested. The venv and build folders are derived from it,
# which is why they're gitignored.

[build-system]
# pip can't turn a folder into a package. It reads this table, fetches
# the named backend into a temporary environment, and hands off the job.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name: what someone would `pip install`. Hyphens are fine.
name = "satellite-tracker"
version = "0.1.0"
description = "Real-time satellite tracker: TLE -> SGP4 -> az/el -> pass prediction"
requires-python = ">=3.12"
readme = "README.md"
#                          fails if the file it points to is missing.
# Empty on purpose. Skyfield arrives in Phase 1, when we can say why.
dependencies = ["skyfield>=1.49"]

[project.optional-dependencies]
# An "extra": `pip install -e ".[dev]"` installs the package AND these.
# Someone who runs `pip install satellite-tracker` never gets pytest.
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
# src layout: the importable package is src/satellite_tracker/
# (underscore = import name, vs the hyphenated pip name above).
# Tests can only reach it the way an installed user would.
packages = ["src/satellite_tracker"]

[tool.pytest.ini_options]
# Lets a bare `pytest` find the tests with no arguments.
testpaths = ["tests"]
